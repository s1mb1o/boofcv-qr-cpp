name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libopencv-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opencv

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build --target boofcv_qr qr_scan boofcv_qr_tests boofcv_qr_python --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w wheelhouse

      - name: Install wheel and run Python smoke
        shell: bash
        run: |
          python -m venv /tmp/boofcv_qr_smoke
          /tmp/boofcv_qr_smoke/bin/python -m pip install --upgrade pip
          /tmp/boofcv_qr_smoke/bin/python -m pip install numpy
          /tmp/boofcv_qr_smoke/bin/python -m pip install --no-index --find-links wheelhouse boofcv-qr-cpp
          BOOFCV_QR_FIXTURE_DIR="$PWD/tests/fixtures/qr" \
            /tmp/boofcv_qr_smoke/bin/python tests/python/test_pyboof_compat.py
