plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

ext.boofcvVersion = '1.3.0'

dependencies {
    implementation "org.boofcv:boofcv-recognition:${boofcvVersion}"
    implementation "org.boofcv:boofcv-io:${boofcvVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

application {
    mainClass = 'qrboofcv.Baseline'
    // Headless and ample heap for large images.
    applicationDefaultJvmArgs = [
        '-Djava.awt.headless=true',
        '-Xmx4g'
    ]
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:none'
}

tasks.named('run') {
    // Forward CLI args. Invoke with: ./gradlew run --args="<datasetRoot> <outDir>"
    standardInput = System.in
}

// Stage-dump task per CLAUDE.md "Intermediate-state dumps for debugging
// parity failures". Invoke with:
//   ./gradlew dumpStages --args="<image.png> <outDir>"
tasks.register('dumpStages', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'qrboofcv.DumpStages'
    jvmArgs = ['-Djava.awt.headless=true', '-Xmx2g']
}
